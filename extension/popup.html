<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paragraph Translator</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Paragraph Translator</h1>
      <p class="subtitle">translate paragraph and show</p>
    </header>

    <section class="block">
      <label class="label" for="level">English level</label>
      <input id="level" type="range" min="0" max="5" step="1" />
      <div class="level-row">
        <span>A1</span>
        <strong id="levelLabel">C1</strong>
        <span>C2</span>
      </div>
    </section>

    <section class="block">
      <button id="loginBtn" class="btn primary" type="button">구글로 로그인하기</button>
      <div id="userRow" class="user-row hidden">
        <span id="userEmail"></span>
        <button id="logoutBtn" class="btn ghost" type="button">로그아웃</button>
      </div>
    </section>

    <section class="block toggle-row">
      <span>active</span>
      <label class="switch">
        <input id="activeToggle" type="checkbox" />
        <span class="slider"></span>
      </label>
    </section>

    <div id="status" class="status">비활성</div>
    <p id="hint" class="hint"></p>

    <script type="module" src="popup.js"></script>
  </body>
</html>
